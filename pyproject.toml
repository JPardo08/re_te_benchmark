[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "re-te-benchmark"
version = "0.1.0"
description = "Reproducible benchmark assets for legal relation and triple extraction"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
build-hohfeld = "re_te_benchmark.cli:build_main"
audit-hohfeld = "re_te_benchmark.cli:audit_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
